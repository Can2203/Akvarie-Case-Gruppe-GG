<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Fisken Spil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/findFisk.css">
    <link rel="stylesheet" href="css/overgang.css">
  </head>
  <body>
    <main id="game-container">
    <section id="start-screen" class="screen active">
        <header class="menu-header">
        </header>

        <section class="titel">
            <h1> Aktiviteter</h1>
        </section>

        
        <section class="menu-cards" role="list">
            <article class="card" role="listitem">
                <img src="images/FindFIskPre.svg" alt="Find fisken cover">
                <button type="button" class="btn-play" onclick="startGame()">Find Fisken</button>
            </article>

            <article class="card" role="listitem">
                <img src="images/FindFIskPre.svg" alt="Pincetfisk">
                <button type="button" class="btn-play" onclick="window.location.href='NYfarvfisken.html'">Farv fisk</button>
            </article>

            <article class="card" role="listitem">
                <img src="images/kaploeb.svg" alt="Ildhalekutling">
                <button type="button" class="btn-play disabled"disabled>Kapløb</button>
            </article>
        </section>



    </section>

    <section id="play-screen" class="screen" aria-label="Spilsscene">
                <article id="target-prompt" class="speech-bubble-wrapper" aria-live="polite">
                    <article class="bubble-circle">
                    <img src="Fisk-svg/KongeFebars.svg" alt="Gemt fisk" class="target-img">
                    <div class="speech-bubble">Kan du finde mig?</div>
                    </article>
                </article>

                <section class="ocean-elements" aria-label="Havet med otte fisk">
                    <img src="Fisk-svg/Antais.svg" class="sea-item fish-blue" alt="Antais" onclick="wrongClick()">
                    <img src="Fisk-svg/Hugofisk.svg" class="sea-item fish-yellow" alt="Hugofisk" onclick="wrongClick()">
                    <img src="Fisk-svg/Ildhalekutling.svg" class="sea-item fish-blue" alt="Ildhalekutling" onclick="wrongClick()">
                    <img id="hidden-fish" src="Fisk-svg/KongeFebars.svg" class="sea-item hidden-fish" alt="Målfisk" onclick="foundFish()">
                    <img src="Fisk-svg/Nemo.svg" class="sea-item fish-yellow" alt="Nemo" onclick="wrongClick()">
                    <img src="Fisk-svg/Paletkirug.svg" class="sea-item fish-blue" alt="Paletkirug" onclick="wrongClick()">
                    <img src="Fisk-svg/Pincetfisk.svg" class="sea-item fish-yellow" alt="Pincetfisk" onclick="wrongClick()">
                    <img src="Fisk-svg/RogFarvetKirugANI.svg" class="sea-item fish-blue" alt="RogFarvetKirugANI" onclick="wrongClick()">
                </section>

                <section id="success-message" class="speech-bubble-wrapper hidden" aria-live="polite">
                    <img src="Fisk-svg/KongeFebars.svg" class="target-img-large" alt="Fisk med succesmeddelelse">
                    <div class="speech-bubble">Du fandt mig!</div>
                </section>
    </section>
