<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Fisken Spil</title>
    <link rel="stylesheet" href="css/findFisk.css">
  </head>
  <body>
    <main id="game-container">
    <section id="start-screen" class="screen active">
        <header class="menu-header">
        </header>

        
        <div class="menu-cards" role="list">
            <article class="card" role="listitem">
                <img src="images/FindFIskPre.svg" alt="Find fisken cover">
                <button type="button" class="btn-play" onclick="startGame()">FIND FISKEN</button>
            </article>

            <article class="card" role="listitem">
                <img src="images/FindFIskPre.svg" alt="Pincetfisk">
                <button type="button" class="btn-play disabled"disabled>SPIL</button>
            </article>

            <article class="card" role="listitem">
                <img src="images/FindFIskPre.svg" alt="Ildhalekutling">
                <button type="button" class="btn-play disabled"disabled>SPIL</button>
            </article>
        </div>
    </section>

    <section id="play-screen" class="screen" aria-label="Spilsscene">
                <div id="target-prompt" class="speech-bubble-wrapper" aria-live="polite">
                    <div class="bubble-circle">
                    <img src="Fisk-svg/KongeFebars.svg" alt="Gemt fisk" class="target-img">
                    <div class="speech-bubble">Kan du finde mig?</div>
                    </div>
                </div>

                <div class="ocean-elements" aria-label="Havet med fisk og skaldyr">
                    <img src="Assets/Property%201=VandMandLilla.svg" class="sea-item jellyfish1" alt="VandMandLilla" onclick="wrongClick()">
                    <img src="Fisk-svg/Ildhalekutling.svg" class="sea-item fish-blue" alt="Ildhalekutling" onclick="wrongClick()">
                    <img src="Assets/Property%201=UrchinLilla.svg" class="sea-item urchin" alt="UrchinLilla" onclick="wrongClick()">
                    <img src="Assets/Property%201=VandMandGul.svg" class="sea-item jellyfish2" alt="VandMandGul" onclick="wrongClick()">
                    <img src="Fisk-svg/Pincetfisk.svg" class="sea-item fish-yellow" alt="Pincetfisk" onclick="wrongClick()">
                    <img id="hidden-fish" src="Fisk-svg/KongeFebars.svg" class="sea-item hidden-fish" alt="Målfisk" onclick="foundFish()">
                </div>

                <div id="success-message" class="speech-bubble-wrapper hidden" aria-live="polite">
                    <img src="Fisk-svg/KongeFebars.svg" class="target-img-large" alt="Fisk med succesmeddelelse">
                    <div class="speech-bubble">Du fandt mig!</div>
                </div>
    </section>

    <nav id="bottom-nav" aria-label="Spilnavigation">
        <button type="button" class="nav-btn home-btn" onclick="showMenu()" aria-label="Tilbage til menu"></button>
        <button type="button" class="nav-btn play-btn" onclick="showMenu()" aria-label="Tilbage til menu"></button>
        <button type="button" class="nav-btn book-btn" aria-label="Bog"></button>
    </nav>
    </main>

   

    <script src="js/findFisk.js"></script>
  </body>
</html>
